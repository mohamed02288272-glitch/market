.pf{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.pf .pb{width:100%;font-size:19px;box-shadow:none}
label{display:block;color:var(--mut);font-weight:600;margin:14px 0 6px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px 16px 16px;margin-top:14px}
.lr{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--mut);font-size:14px}
.num{font-size:26px;font-weight:800;text-align:center}
.wrap{display:flex;flex-wrap:wrap;gap:8px}.wrap .ch{background:var(--card);border:1px solid var(--line)}.wrap .ch.on{background:var(--btn)}
.hist{margin-top:18px;padding-top:6px;border-top:1px dashed var(--line)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-top:10px}
.row .e{width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.row .n{flex:1}.row .n small{display:block;color:var(--mut)}
.row button{width:38px;height:38px;border-radius:12px}.row button:disabled{opacity:.3}
.tt{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:12px 18px;border-radius:16px;font-weight:600;z-index:40;max-width:90%;text-align:center;display:none}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.del{color:var(--red);font-weight:600;margin-top:16px;width:100%;padding:12px}
.msgs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mg{max-width:80%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px;align-self:flex-start;overflow-wrap:anywhere}
.mg.me{align-self:flex-end;background:var(--btn);color:var(--btnt);border:0}
.mg small{display:block;opacity:.7;font-size:11px}
.cin{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px 16px;max-width:560px;margin:0 auto;background:var(--bg);z-index:4}

:root{--bg:#f1f5ef;--bg2:#e4eee7;--card:#fff;--ink:#10372b;--mut:#6b8076;--line:#dce7df;--lime:#e1f3cf;--limet:#2f6b12;--gold:#c27a0e;--plum:#a02a63;--red:#d63a2b;--grn:#15803d;--btn:linear-gradient(135deg,#0d6b4d,#1fa37a);--btnt:#fff;--inp:#f8fbf8;--g1:#0b5d46;--g2:#1c9a7a}

:root[data-theme="dark"]{--bg:#0b1612;--bg2:#08100d;--card:#13231d;--ink:#e8f2ea;--mut:#8aa396;--line:#21372d;--lime:#2c4720;--limet:#d3ee80;--gold:#f2b64e;--plum:#f492c0;--red:#ff7b6b;--grn:#5fe3a2;--btn:linear-gradient(135deg,#25c58b,#a8dd4d);--btnt:#06241a;--inp:#0e1b16;--g1:#0f3d30;--g2:#14806a}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;line-height:1.3}button{line-height:1.2}
input{line-height:1.2;height:30px}.num{height:32px;font-size:15px;text-align:center;padding:4px}
.hd{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 16px rgba(0,0,0,.18)}

 if(owner){op(hd('الإعدادات','الأقسام والفريق')+`<div class="pbd"><button class="sb" style="width:100%;margin-bottom:6px" onclick="cats()">🏷️ الأقسام</button><button class="pb" style="width:100%;margin-bottom:6px" onclick="$('#af').hidden=!$('#af').hidden">＋ إضافة عضو للتيم</button><div class="box" id="af" hidden><label>اسم الشخص</label><input id="an"><label>اسم المستخدم (حروف إنجليزي)</label><input id="au" dir="ltr" autocapitalize="none"><label>الباسورد</label><input id="ap" dir="ltr"><button class="pb" style="margin-top:10px;width:100%" onclick="mk()">＋ إضافة للفريق</button></div><div id="sh2"></div><div id="al"></div><button class="sb" style="width:100%;margin-top:10px" onclick="lo()">تسجيل خروج</button></div>`);al()}
 else op(hd('حسابي','')+`<div class="pbd"><button class="sb" style="width:100%;margin-bottom:6px" onclick="cats()">🏷️ الأقسام</button><div class="row"><div class="n">${esc(who(me))}</div><button class="sb" onclick="lo()" style="width:auto">خروج</button></div></div>`)
}
async function mk(){const n=$('#an').value.trim(),u=$('#au').value.trim().toLowerCase(),p=$('#ap').value;if(!n||!/^[a-z0-9_.-]{3,20}$/.test(u)||u==='owner'||p.length<6)return toast('اكتب الاسم، ويوزر إنجليزي (3 حروف+)، وباسورد 6 حروف أو أكتر');try{if((await db.doc('accounts/'+u).get()).exists)return toast('اليوزر ده موجود');const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(firebaseConfig,'sec');const sa=sec.auth();await sa.createUserWithEmailAndPassword(u+'@'+DOM,p);await sa.signOut();await db.doc('accounts/'+u).set({name:n,at:Date.now()});const msg='سوبر ماركت الشيخ ايمن\nالرابط: '+LK+'\nاليوزر: '+u+'\nالباسورد: '+p;window.LM=msg;$('#af').hidden=true;['#an','#au','#ap'].forEach(i=>$(i).value='');$('#sh2').innerHTML=`<div class="box"><label>اتضاف ✅ ابعت له البيانات دي</label><pre style="white-space:pre-wrap;text-align:right;font:inherit;font-size:11px;margin:4px 0 8px;overflow-wrap:anywhere">${esc(msg)}</pre><div style="display:flex;gap:6px"><a class="pb" style="text-decoration:none;flex:1;text-align:center" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">واتساب</a>${navigator.share?'<button class="sb" onclick="nsh()">مشاركة</button>':''}</div></div>`}catch(e){toast(e.code==='auth/email-already-in-use'?'اليوزر ده اتستخدم قبل كده، اختار غيره':'حصلت مشكلة — جرّب تاني')}}
async function da(u){try{await db.doc('accounts/'+u).delete()}catch(e){toast('مفيش صلاحية')}}
function lo(){auth.signOut().then(()=>location.reload())}
async function li(){const u=$('#gu').value.trim().toLowerCase(),p=$('#gp').value;$('#ge').textContent='';if(!u||!p){$('#ge').textContent='اكتب اليوزر والباسورد';return}try{await auth.signInWithEmailAndPassword(u+'@'+DOM,p)}catch(e){$('#ge').textContent=(e.code==='auth/network-request-failed')?'مفيش نت':'اليوزر أو الباسورد غلط'}}
function start(){
 if(started)return;started=true;
 const lt=setTimeout(()=>{if(!P.length)$('#pl').innerHTML='<div class="empty">التحميل بطيء… اتأكد من النت</div>'},10000);
 const er=()=>$('#lv').textContent='انقطع الاتصال';
 db.collection('products').onSnapshot(s=>{clearTimeout(lt);P=s.docs.map(d=>({id:d.id,...d.data()}));rp();if(co)cats()},er);
 db.collection('categories').onSnapshot(s=>{C=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));rp();if(co)cats()},er);
 db.collection('log').orderBy('at','desc').limit(150).onSnapshot(s=>{
  if(!first)s.docChanges().forEach(async c=>{if(c.type==='added'){const x=c.doc.data();if(x.by!==me){ping();await nm([x.by]);toast(`${who(x.by)} ${x.from==null?'سجّل':'عدّل'} ${FL[x.f]} «${x.name}» ← ${fm(x.to)} ج.م`)}}});
  first=false;L=s.docs.map(d=>d.data());rl();rp()},er);
 db.collection('chat').orderBy('at','desc').limit(80).onSnapshot(s=>{if(!cf)s.docChanges().forEach(async c=>{if(c.type==='added'){const x=c.doc.data();if(x.by!==me&&tab!=='c'){ping();await nm([x.by]);toast('💬 '+who(x.by)+': '+String(x.t).slice(0,60))}}});cf=false;CH=s.docs.map(d=>d.data()).reverse();rch();if(tab==='c')window.scrollTo(0,document.body.scrollHeight)},()=>{});
 if(owner)db.collection('accounts').onSnapshot(s=>{AC=s.docs.map(d=>({id:d.id,...d.data()}));al()},()=>{});
 $('#lv').textContent='مباشر · '+(owner?'المالك':who(me));
}
auth.onAuthStateChanged(async us=>{
 if(!us){$('#gate').classList.add('on');return}
 const u=us.email.split('@')[0];owner=us.email===OWNER;
 try{
  let g=await db.doc('accounts/'+u).get();
  if(!g.exists&&owner){await db.doc('accounts/'+u).set({name:'المالك',at:Date.now()});g=await db.doc('accounts/'+u).get()}
  if(!g.exists)throw{code:'permission-denied'};
  me='u:'+u;names[me]=g.data().name;
  if(owner)await seed();
  $('#gate').classList.remove('on');start()
 }catch(e){
  if(e&&e.code==='permission-denied'){await auth.signOut();$('#ge').textContent='الحساب ده اتوقف أو مالوش صلاحية'}else $('#ge').textContent='مشكلة في الاتصال — جرّب تاني';
  $('#gate').classList.add('on')
 }
});
let BH=innerHeight;
function fv(){const v=window.visualViewport,h=v?v.height:innerHeight,t=v?v.offsetTop:0,r=document.documentElement;BH=Math.max(BH,innerHeight);r.style.setProperty('--vh',h+'px');r.style.setProperty('--vt',t+'px');r.classList.toggle('kb',h<BH-120)}
if(window.visualViewport){visualViewport.addEventListener('resize',fv);visualViewport.addEventListener('scroll',fv)}addEventListener('resize',fv);fv();
document.addEventListener('focusin',e=>{const t=e.target;if(!t.matches||!t.matches('input'))return;if(t.closest('.pbd'))setTimeout(()=>t.scrollIntoView({block:'center',behavior:'smooth'}),350);if(t.id==='ci')setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),350)});
rp();rl();
</script>
