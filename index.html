<style>

.gb{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;text-align:center}.gb .logo{margin:0 auto;width:56px;height:56px;font-size:26px;background:var(--btn)}.gb h2{margin:0;font-size:20px}
</style>

<script>

const UN=['قطعة','كيلو','علبة','لتر','باكيت','دستة','شنطة'],FL={retail:'قطاعي',carton:'جملة',buy:'شراء'},OR=['retail','carton','buy'];
const fm=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:2});

const sv_=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const BOOT=Date.now();
let db=null,me='anon',owner=false,canW=true,P=[],C=[],L=[],CH=[],AC=[],names={},tab='p',cat='all',q='',sel={},ren='',co=false,edId='',started=false,first=true,cf=true;

 await Promise.all(all.filter(i=>String(i).startsWith('u:')).map(async i=>{try{const g=await db.doc('accounts/'+i.slice(2)).get();names[i]=g.exists?g.data().name:i.slice(2)}catch(e){names[i]=i.slice(2)}}));

 if(cat!=='all'&&C.length&&!C.some(c=>c.id===cat))cat='all';
